# config.example.yaml — full cloudtui configuration schema.
#
# Copy this file to config.yaml in the same directory to customise the logo,
# theme, or individual palette colors. config.yaml is gitignored, so local
# changes are never committed. If the file is absent, cloudtui uses its
# built-in defaults (the dark theme, shown below).

# theme selects the active built-in palette. The value must match the name of
# a theme file embedded in the binary (e.g. "dark", "cyberpunk"). Available
# themes are listed in the Settings view (s) and can be applied at runtime
# via the dropdown or with :theme <name>.
theme: dark

# logo is rendered in the top-right corner. Any UTF-8 art is accepted.
# Dynamic color tags ([red], [#ff0000]) are intentionally NOT parsed here,
# so box-drawing characters are safe to use.
logo:
  - "╔═══════════╗"
  - "║ CLOUDTUI  ║"
  - "╚═══════════╝"

# colors overrides individual palette fields on top of the selected theme.
# Omit this section entirely (or leave it empty) to use the built-in theme
# palette as-is. Only list the fields you actually want to customise.
# All values: tview/tcell color names ("red", "navy") or hex codes ("#rrggbb").
#
# Available fields:
#   background    — base background applied to every primitive by default
#   border        — box borders, dividers, and view titles
#   label         — field labels, section headings, key hints in the nav panel
#   text          — primary body text in tables and lists
#   value         — secondary content (values, descriptions)
#   accent        — highlighted key names in the status bar and navigation panel
#   selectionBg   — selected-row highlight background in lists and forms
#   selectionText — selected-row highlight text color
#   statusBarBg   — bottom hotkey legend strip background
#   statusBarText — bottom hotkey legend strip text
#   views         — per-view border/title color (falls back to border if absent)
#     home / settings / queues
#
# Example — override just the accent color:
# colors:
#   accent: "#ff0000"

# queue: connection settings for the ActiveMQ broker.
# Password can also be supplied via the MQPROXY_CLIENT_PASSWORD env var
# (the env var is only used when the password field is absent or empty).
queue:
  brokerName: localhost
  url: http://localhost:8161/api/jolokia
  username: admin
  # password: ""   # set here or via MQPROXY_CLIENT_PASSWORD

# ─── Switching themes ─────────────────────────────────────────────────────────
# Change the theme: field above to any available theme name.
# Only the theme name is saved — the full palette is never written to this file.
# Any colors: overrides you set here are preserved across theme switches.
