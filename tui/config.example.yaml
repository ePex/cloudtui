# config.example.yaml — full cloudtui configuration schema.
#
# Copy this file to config.yaml in the same directory to customise the logo,
# theme, or individual palette colors. config.yaml is gitignored, so local
# changes are never committed. If the file is absent, cloudtui uses its
# built-in defaults (the dark theme, shown below).

# theme selects the active built-in palette. The value must match the name of
# a theme file embedded in the binary (e.g. "dark", "cyberpunk"). Available
# themes are listed in the Settings view (s) and can be applied at runtime
# via the dropdown or with :theme <name>.
theme: dark

# logo is rendered in the top-right corner. Any UTF-8 art is accepted.
# Dynamic color tags ([red], [#ff0000]) are intentionally NOT parsed here,
# so box-drawing characters are safe to use.
logo:
  - "╔═══════════╗"
  - "║ CLOUDTUI  ║"
  - "╚═══════════╝"

# colors overrides individual palette fields on top of the selected theme.
# Omit this section entirely (or leave it empty) to use the built-in theme
# palette as-is. Only list the fields you actually want to customise.
# All values: tview/tcell color names ("red", "navy") or hex codes ("#rrggbb").
#
# Available fields:
#   background    — base background applied to every primitive by default
#   border        — box borders, dividers, and view titles
#   label         — field labels, section headings, key hints in the nav panel
#   text          — primary body text in tables and lists
#   value         — secondary content (values, descriptions)
#   accent        — highlighted key names in the status bar and navigation panel
#   selectionBg   — selected-row highlight background in lists and forms
#   selectionText — selected-row highlight text color
#   statusBarBg   — bottom hotkey legend strip background
#   statusBarText — bottom hotkey legend strip text
#   views         — per-view border/title color (falls back to border if absent)
#     home / settings / queues
#
# Example — override just the accent color:
# colors:
#   accent: "#ff0000"

# activeConnection: the name of the connection that is active on startup.
activeConnection: default

# connections: named broker connections. Each connection has:
#   name    — unique identifier (also the activeConnection key, and what's
#             shown in the top-left info panel and connection manager)
#   backend — "jolokia" or "proxy"
#   queue   — Jolokia backend settings (used when backend: jolokia)
#   proxy   — mq-proxy backend settings (used when backend: proxy)
#
# Password fields can also be supplied via the MQPROXY_CLIENT_PASSWORD env var;
# the env var is only applied when the password field is absent or empty.
#
# passwordSecret (optional, on queue: or proxy:): names an AWS Secrets
# Manager secret to use as the password instead. Resolved at connect time
# via the AWS profile selected in Settings -> AWS Profiles (activeAWSProfile
# below) — a connection using passwordSecret needs a profile selected there.
# When set, it takes precedence over both password and
# MQPROXY_CLIENT_PASSWORD; the secret's raw string value is used verbatim
# (no JSON key extraction).
connections:
  - name: default
    backend: jolokia
    queue:
      brokerName: localhost
      url: http://localhost:8161/api/jolokia
      username: admin
      # password: ""   # set here or via MQPROXY_CLIENT_PASSWORD
      # passwordSecret: "/cloudtui/local/mq-password"   # or resolve from AWS Secrets Manager instead

  # Example proxy connection (uncomment and fill in to use):
  # - name: aws-staging
  #   backend: proxy
  #   proxy:
  #     url: http://localhost:8080
  #     username: cloudtui
  #     password: changeme
  #     # passwordSecret: "/cloudtui/aws-staging/mq-password"

# activeAWSProfile: the AWS CLI profile selected in Settings -> AWS Profiles
# (read from ~/.aws/config / ~/.aws/credentials, or their AWS_CONFIG_FILE /
# AWS_SHARED_CREDENTIALS_FILE overrides). Independent of `connections` above —
# this is discovery/selection only; it isn't wired to any broker connection
# yet. Leave unset if you don't use AWS CLI profiles.
# activeAWSProfile: my-profile

# datadog: settings for the Datadog Logs view, editable via Settings -> Datadog.
#   site        — e.g. "datadoghq.com", "datadoghq.eu"; defaults to
#                 "datadoghq.com" if unset. The API host is api.<site>.
#   accessToken — a Datadog Personal Access Token (Personal Settings ->
#                 Access Tokens, scope "logs_read_data"). NOT the classic
#                 API Key + Application Key pair — a PAT authenticates
#                 alone. Can also be supplied via the DD_ACCESS_TOKEN env
#                 var instead of stored here (only applied when this field
#                 is empty).
# datadog:
#   site: datadoghq.eu
#   accessToken: ""   # set here or via DD_ACCESS_TOKEN

# awsFavorites: favorited items in the SSM Parameters, Secrets Manager, and
# CloudWatch Logs views, toggled in-app with 'f' — you normally never hand-edit
# this, it's shown here for reference (e.g. if you want to pre-seed or copy
# favorites between machines). Favorited rows sort above non-favorited ones
# and show a star in the list. Scoped per AWS profile (a name is only
# meaningful within the account a profile points at) and per item kind
# (ssmParameters/secrets/logGroups are independent — the same name favorited
# in one has no bearing on the others). Each is a map of profile name to a
# list of favorited item names; omit entirely (or leave a kind/profile
# unlisted) for "no favorites yet".
# awsFavorites:
#   ssmParameters:
#     my-profile:
#       - /app/db/password
#   secrets:
#     my-profile:
#       - prod/db
#   logGroups:
#     my-profile:
#       - /aws/lambda/my-fn

# ─── Switching themes ─────────────────────────────────────────────────────────
# Change the theme: field above to any available theme name.
# Only the theme name is saved — the full palette is never written to this file.
# Any colors: overrides you set here are preserved across theme switches.
