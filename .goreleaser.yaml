version: 2

project_name: cloudtui

before:
  hooks:
    # Plain strings only here (no cmd/dir object form, unlike
    # builds[].hooks.pre) — wrapped in sh -c so `&&`/cd work. Runs once
    # for the whole release, unlike a build-level hook which would
    # repeat per goos/goarch target.
    - sh -c "cd tui && go test ./..."

builds:
  - id: tui
    dir: tui
    main: ./cmd/cloudtui
    binary: cloudtui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: tui
    ids: [tui]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "cloudtui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: cloudtui
    repository:
      owner: ePex
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/ePex/cloudtui"
    description: "A terminal UI for managing cloud resources."
    license: "MIT"
    binaries:
      - cloudtui

scoops:
  - name: cloudtui
    repository:
      owner: ePex
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/ePex/cloudtui"
    description: "A terminal UI for managing cloud resources."
    license: "MIT"

changelog:
  sort: asc
  groups:
    - title: Features
      # [[:word:]] excludes "-", so a hyphenated scope like "mq-proxy"
      # (this repo has commits like "feat(mq-proxy): ...") wouldn't
      # match — confirmed missing from v0.1.0's changelog. [\w-] covers
      # both plain and hyphenated scopes.
      regexp: '^.*?feat(\([\w-]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([\w-]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - 'Merge pull request'
