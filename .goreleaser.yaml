version: 2

project_name: cloudtui

before:
  hooks:
    # Plain strings only here (no cmd/dir object form, unlike
    # builds[].hooks.pre) — wrapped in sh -c so `&&`/cd work. Runs once
    # for the whole release, unlike a build-level hook which would
    # repeat per goos/goarch target.
    - sh -c "cd tui && go test ./..."

builds:
  - id: tui
    dir: tui
    main: ./cmd/tui
    binary: cloudtui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: tui
    ids: [tui]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "cloudtui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'
      - 'Merge pull request'
