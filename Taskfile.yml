version: '3'

tasks:
  doctor:
    desc: Check that the required local tooling (Go, Task) is installed.
    cmds:
      - go version
      - task --version

  build:
    desc: Build all binaries.
    deps: [build:tui]

  build:tui:
    desc: Build the tui binary into tui/bin/.
    dir: tui
    cmds:
      - go build -o bin/cloudtui{{exeExt}} ./cmd/cloudtui

  run:tui:
    desc: Run the tui application from source.
    dir: tui
    cmds:
      - go run ./cmd/cloudtui

  seed:queue:
    desc: 'Send sample JSON messages to a queue via Jolokia. Usage: task seed:queue -- <queue> <count>'
    dir: tui
    cmds:
      - go run ./cmd/seedqueue {{.CLI_ARGS}}

  test:queue:add:
    desc: 'Create a disposable ActiveMQ queue for manual testing. Usage: task test:queue:add -- <name>'
    dir: tui
    cmds:
      - go run ./cmd/devtool add-queue {{.CLI_ARGS}}

  test:queue:remove:
    desc: 'Remove a disposable ActiveMQ queue created for manual testing. Usage: task test:queue:remove -- <name>'
    dir: tui
    cmds:
      - go run ./cmd/devtool remove-queue {{.CLI_ARGS}}

  dev:proxy:start:
    desc: Build and start mq-proxy in the background, for live-testing the proxy backend.
    dir: tui
    cmds:
      - go run ./cmd/devtool start-proxy

  dev:proxy:stop:
    desc: Stop the mq-proxy instance started by dev:proxy:start.
    dir: tui
    cmds:
      - go run ./cmd/devtool stop-proxy

  smoke:test:
    desc: >-
      Drive the real TUI against a real broker through the golden path
      (list/browse/mark/delete/move messages, switch to the proxy backend).
      Requires tmux and a JDK 21+ JAVA_HOME. POSIX/macOS/Linux only.
    dir: tui
    cmds:
      - ./scripts/smoke-test.sh

  verify:proxy-api:
    desc: >-
      Exercise the mq-proxy/reference-API REST contract directly (send,
      detail fields, filter, delete one/several, move one/several, purge).
      Usage: task verify:proxy-api -- <base-url> <username> <password>
      <queue> [target-queue]. Requires curl and jq. DESTRUCTIVE — see the
      script's header before pointing it at a real queue.
    dir: tui
    cmds:
      - ./scripts/verify-proxy-api.sh {{.CLI_ARGS}}

  test:
    desc: Run all tests.
    deps: [test:tui, test:proxy]

  test:tui:
    desc: Run tui unit tests.
    dir: tui
    cmds:
      - go test ./...

  build:proxy:
    desc: Build the mq-proxy JAR and container image.
    deps: [build:proxy:jar]
    dir: mq-proxy
    cmds:
      - podman build -t mq-proxy .

  build:proxy:jar:
    desc: Build the mq-proxy JAR (no container image).
    dir: mq-proxy
    cmds:
      - '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}} bootJar'

  run:proxy:
    desc: Run the mq-proxy application from source.
    dir: mq-proxy
    cmds:
      - '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}} bootRun'

  test:proxy:
    desc: Run mq-proxy unit tests.
    dir: mq-proxy
    cmds:
      - '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}} test'

  openapi:proxy:
    desc: Regenerate mq-proxy/openapi.yaml from the running app's live spec.
    dir: mq-proxy
    cmds:
      - '{{if eq OS "windows"}}cmd /c gradlew.bat{{else}}./gradlew{{end}} generateOpenApiDocs'
